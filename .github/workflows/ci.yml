name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run. A lock file pins what to install but cannot guarantee it still
  # exists: releases get yanked, external sources move. Catches that rot while
  # nobody is touching the code.
  schedule:
    - cron: "0 6 * * 1"

# A new push to the same branch cancels the previous, still-running job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and tests stay in one job: splitting them would repeat checkout + uv
  # install + sync for a suite that runs in seconds. Split when either arrives:
  #   - a matrix (several Python versions or operating systems);
  #   - a test suite longer than a minute.
  # The required status check in the branch ruleset is matched by job name: renaming
  # `checks` means updating the ruleset in the same change, or every PR is blocked.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of sync with pyproject.toml instead of
      # silently re-resolving. This is the actual reproducibility check: it proves
      # the committed lock file describes the committed intent.
      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks developers run locally, so CI and pre-commit can never
      # disagree about what "clean" means. See ADR-0002.
      - name: Lint, format and file checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest

      # Deselected on every ordinary run: a suite that depends on someone else's
      # uptime is not a suite you can trust. On the weekly schedule a failure here
      # is the signal it is meant to be -- an external source moved or vanished.
      - name: External sources still reachable
        if: github.event_name == 'schedule'
        run: uv run pytest -m network

  # A separate job because it tests a different thing: not the code but the image.
  # System libraries, the model download and its checksums, packaged static files --
  # failures no unit test can see (journal E-014).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the service image
        run: docker build -t sillage:ci .

      - name: Run it and check it end to end
        run: |
          docker run -d --name sillage -p 8000:8000 sillage:ci
          python3 scripts/smoke_test.py http://localhost:8000 --wait 90 \
            || { docker logs sillage; exit 1; }

  # Only after a merge to main, and only once both the code and the image passed.
  deploy:
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Upload to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/deploy_space.py

      # The Space builds the image itself, which takes a few minutes. Wait for it and
      # check the public URL the same way as the container above: a deploy is not
      # done when the upload finishes, it is done when the link works.
      - name: Check the public link
        run: |
          url=$(python3 -c "import json; print(json.load(open('deploy/hub.json'))['space_url'])")
          python3 scripts/smoke_test.py "$url" --wait 1200
