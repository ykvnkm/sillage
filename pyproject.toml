[project]
name = "sillage"
description = "Open molecule -> mixture -> perception system for perfumery"
readme = "README.md"
authors = [{ name = "ykvnkm", email = "michailyakovenk3@gmail.com" }]

# What the package supports. Deliberately open-ended upwards: training runs on
# Colab/Kaggle, whose interpreter we do not control. The version we develop
# against is pinned separately in .python-version.
requires-python = ">=3.11"

# Runtime dependencies are added only when a module actually imports them.
# An honest lock file is one where every entry can be traced to a real import.
dependencies = [
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "rdkit>=2026.3.5",
]

# Single source of truth for the version: src/sillage/__init__.py
dynamic = ["version"]

[project.scripts]
sillage-data = "sillage.data.cli:main"

[dependency-groups]
# Development-only tools. Not installed for end users of the package.
dev = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sillage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sillage"]

# --- Linting and formatting --------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "UP",  # pyupgrade: outdated syntax
    "B",   # flake8-bugbear: likely bugs
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    # Ambiguous-unicode rules. They guard against Cyrillic letters that look like
    # Latin ones sneaking into identifiers. This project writes Russian in strings,
    # comments and docstrings on purpose, so the rule fires on every line of prose.
    "RUF001", # ambiguous character in a string
    "RUF002", # ambiguous character in a docstring
    "RUF003", # ambiguous character in a comment
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are read top to bottom, so a section that starts with its own imports
# is clearer than one big import cell at the top.
"notebooks/*.ipynb" = ["E402"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are deselected by default: a suite whose result depends on someone
# else's uptime is not a suite you can trust. CI runs them on a schedule instead,
# with `-m network`, where a failure means the external source moved.
addopts = "-ra --strict-markers -m 'not network'"
markers = ["network: reaches an external source over the internet"]
